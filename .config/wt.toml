# Complete setup before an agent starts editing. T3 invokes this same pipeline
# through pnpm worktree:setup after it creates and binds the checkout.
[[pre-start]]
copy-dependencies = "wt step copy-ignored --require-include"

[[pre-start]]
install = "pnpm install --frozen-lockfile"

[[pre-start]]
build = "pnpm build"

# Run after Worktrunk rebases the task branch onto its merge target.
[pre-merge]
validate = "pnpm build && pnpm test"
