# See docs/worktrunk.md.
[[pre-start]]
install = "pnpm install --frozen-lockfile"

[[pre-start]]
vault = "pnpm build"

[post-start]
dev = "node scripts/worktree-dev-server.mjs start '{{ worktree_path }}' '{{ primary_worktree_path }}'"

[pre-remove]
dev = "node scripts/worktree-dev-server.mjs stop '{{ worktree_path }}' '{{ primary_worktree_path }}'"

[pre-merge]
build = "pnpm build"

[step.copy-ignored]
exclude = [".dev-vault/", ".worktrees/"]
