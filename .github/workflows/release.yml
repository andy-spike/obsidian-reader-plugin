name: Obsidian release

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Validate release version
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const versions = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
          assert.equal(manifest.version, process.env.GITHUB_REF_NAME);
          assert.equal(pkg.version, manifest.version);
          assert.equal(versions[manifest.version], manifest.minAppVersion);
          JS
      - name: Validate and prepare Obsidian release
        uses: obsidianmd/obsidian-workflows@4a7f7cd9da77b67dfbb5246f1e990ffcac7582d3 # v1
        with:
          type: plugin
          mode: release
          build: 'false'
          scanner-lint: 'true'
          strict: 'true'
          node-version: '22'
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Set draft release title and notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --title "Reading Desk $GITHUB_REF_NAME" --notes-file ".github/release-notes/$GITHUB_REF_NAME.md"
